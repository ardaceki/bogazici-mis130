name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting, lint, sources, and build
        run: npm run check
      - name: Check repeatable build output
        run: npm run check:reproducible
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm test
      - name: Test production output
        run: npm run test:production
      - name: Save verified static build
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist/
          retention-days: 30
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-diagnostics
          path: |
            test-results/
            playwright-report/
          retention-days: 7
