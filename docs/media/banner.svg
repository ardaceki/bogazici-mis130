<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">MIS 130 R Workshop</title>
  <desc id="description">A green project banner with the tagline A space to practise, experiment, and understand R, alongside an illustrative R console.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#203c2e"/>
      <stop offset="1" stop-color="#345a45"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#c0d6c5" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="16" fill="url(#background)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>
  <circle cx="1160" cy="370" r="255" fill="#a9c8ad" fill-opacity=".05"/>
  <circle cx="1160" cy="370" r="185" fill="none" stroke="#a9c8ad" stroke-opacity=".1"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="56" y="49" width="178" height="30" rx="15" fill="#c5dbc5" fill-opacity=".12"/>
    <text x="73" y="69" fill="#dae9d8" font-size="12" font-weight="700" letter-spacing="1.6">LEARN BY DOING</text>
    <text x="54" y="149" fill="#f7f8f5" font-size="57" font-weight="700" letter-spacing="-2">MIS 130</text>
    <text x="56" y="200" fill="#c6ddc6" font-size="36" font-weight="400" letter-spacing="-.7">R Workshop</text>
    <text x="57" y="249" fill="#e3ebe0" font-size="18">A space to practise, experiment,</text>
    <text x="57" y="276" fill="#e3ebe0" font-size="18">and understand R.</text>
    <text x="57" y="322" fill="#b6ccba" font-size="13" letter-spacing=".8">IN YOUR BROWSER  /  AT YOUR PACE</text>
    <rect x="661" y="54" width="475" height="252" rx="12" fill="#152a20" fill-opacity=".7" stroke="#86a58b" stroke-opacity=".3"/>
    <path d="M 661 97 H 1136" stroke="#86a58b" stroke-opacity=".2"/>
    <circle cx="683" cy="76" r="4" fill="#789c80"/>
    <circle cx="698" cy="76" r="4" fill="#789c80"/>
    <circle cx="713" cy="76" r="4" fill="#789c80"/>
    <text x="1113" y="81" text-anchor="end" fill="#b6ccba" font-size="12" letter-spacing=".7">R CONSOLE</text>
    <g font-family="Consolas, 'Liberation Mono', monospace" font-size="19">
      <text x="686" y="139" fill="#93b99a">&gt; <tspan fill="#e7eee4">scores &lt;- c(72, 85, 91)</tspan></text>
      <text x="686" y="176" fill="#93b99a">&gt; <tspan fill="#e7eee4">mean(scores)</tspan></text>
      <text x="686" y="213" fill="#c6ddc6">[1] 82.66667</text>
    </g>
    <path d="M 686 237 H 1111" stroke="#86a58b" stroke-opacity=".2"/>
    <circle cx="693" cy="272" r="7" fill="#a1c7a2"/>
    <path d="m 690 272 2 2 4 -4" fill="none" stroke="#203c2e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="712" y="277" fill="#d8e7d5" font-size="14">Write. Run. Understand.</text>
  </g>
</svg>
